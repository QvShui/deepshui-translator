<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'">
  <title>deepshui-translator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 工具栏 -->
  <div id="toolbar">
    <button id="btn-open" title="打开 PDF (Ctrl+O)">📂 打开</button>
    <span class="sep"></span>
    <button id="btn-zoom-out" title="缩小">−</button>
    <span id="zoom-label">100%</span>
    <button id="btn-zoom-in" title="放大">+</button>
    <span class="sep"></span>
    <span id="page-info">— / —</span>
    <input id="page-input" type="number" min="1" value="1" title="跳转页码">
    <button id="btn-goto" title="跳转">跳转</button>
    <span class="spacer"></span>
    <button id="btn-settings" title="设置">⚙️</button>
  </div>

  <!-- 主区域 -->
  <div id="main">
    <!-- PDF 阅读区 -->
    <div id="pdf-container">
      <div id="pdf-placeholder">
        <div class="placeholder-inner">
          <div class="placeholder-icon">📄</div>
          <p id="placeholder-text">打开一个 PDF 文件开始阅读</p>
          <button id="btn-open-placeholder">打开 PDF</button>
          <p class="hint">或直接将 PDF 拖入窗口</p>
          <p id="loading-progress" class="hidden"></p>
        </div>
      </div>
      <div id="pdf-viewer"></div>
    </div>

    <!-- 翻译侧边栏 -->
    <div id="sidebar">
      <div id="sidebar-header">
        <span>翻译</span>
        <div class="sidebar-controls">
          <select id="engine-select" title="翻译引擎">
            <option value="youdao">有道</option>
            <option value="baidu">百度</option>
            <option value="xunfei">讯飞</option>
            <option value="deepl">DeepL</option>
            <option value="google">Google</option>
          </select>
          <select id="target-lang" title="目标语言">
            <option value="zh-CN">中文</option>
            <option value="en">英文</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="fr">法语</option>
            <option value="de">德语</option>
          </select>
        </div>
      </div>
      <div id="sidebar-content">
        <div id="translate-placeholder">
          <p>在 PDF 中选中文本，<br>翻译结果会显示在这里</p>
        </div>
        <div id="translate-result" class="hidden">
          <div class="result-block">
            <div class="result-label">原文</div>
            <div id="result-source" class="result-text"></div>
          </div>
          <div class="result-block">
            <div class="result-label">译文 <button id="btn-copy" title="复制译文">📋</button></div>
            <div id="result-target" class="result-text"></div>
          </div>
          <div id="result-footer">
            <span id="result-engine">有道翻译</span>
            <span id="result-status"></span>
          </div>
        </div>
        <div id="translate-loading" class="hidden">
          <div class="spinner"></div>
          <p>翻译中...</p>
        </div>
        <div id="translate-error" class="hidden">
          <p id="error-text"></p>
        </div>

        <!-- AI 解释 -->
        <div id="ai-explain" class="hidden">
          <div class="ai-header">
            <span>AI 解释</span>
            <span id="ai-explain-status" class="ai-status"></span>
          </div>
          <div id="ai-explain-content" class="ai-content"></div>
        </div>

        <!-- AI 问答 -->
        <div id="ai-ask" class="hidden">
          <div class="ai-header">
            <span>AI 问答</span>
            <span id="ai-ask-status" class="ai-status"></span>
          </div>
          <div id="ai-ask-content" class="ai-content"></div>
          <div class="ai-ask-input">
            <input id="ai-ask-box" type="text" placeholder="向 AI 提问...">
            <button id="ai-ask-send">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 设置面板 -->
  <div id="settings-overlay" class="hidden">
    <div id="settings-panel">
      <div id="settings-header">
        <span>⚙️ 设置</span>
        <button id="btn-settings-close">✕</button>
      </div>
      <div class="settings-tabs">
        <button class="settings-tab active" data-tab="engine-tab">翻译引擎</button>
        <button class="settings-tab" data-tab="ai-tab">AI 引擎</button>
      </div>
      <div class="settings-body">
        <div id="engine-tab">
          <h3>翻译引擎</h3>
          <p class="settings-hint">选择引擎并填写对应凭证，凭证仅保存在本机用户目录</p>
          <div class="form-row">
            <label>默认引擎</label>
            <select id="set-engine">
              <option value="youdao">有道翻译</option>
              <option value="baidu">百度翻译</option>
              <option value="xunfei">讯飞翻译</option>
              <option value="deepl">DeepL</option>
              <option value="google">Google 翻译</option>
            </select>
          </div>
          <div class="form-row">
            <label>默认目标语言</label>
            <select id="set-lang">
              <option value="zh-CN">中文</option>
              <option value="en">英文</option>
              <option value="ja">日语</option>
              <option value="ko">韩语</option>
              <option value="fr">法语</option>
              <option value="de">德语</option>
            </select>
          </div>
          <div id="engine-fields"></div>
          <p class="settings-hint" id="engine-help"></p>
          <div id="settings-status"></div>
          <div class="settings-actions">
            <button id="btn-settings-test">测试连接</button>
            <button id="btn-settings-save">保存</button>
          </div>
        </div>

        <div id="ai-tab" class="hidden">
          <h3>AI 引擎（DeepSeek）</h3>
          <p class="settings-hint">用于 AI 解释和 AI 问答，不影响翻译。注册: https://platform.deepseek.com/api_keys</p>
          <div class="form-row">
            <label>API Key</label>
            <input id="set-ai-key" type="password" placeholder="DeepSeek API Key">
          </div>
          <div class="form-row">
            <label>模型</label>
            <div class="ai-model-row">
              <input id="set-ai-model" type="text" list="ai-model-list" placeholder="deepseek-v4-flash">
              <datalist id="ai-model-list">
                <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                <option value="deepseek-v4-pro">deepseek-v4-pro</option>
              </datalist>
              <button id="btn-ai-refresh" title="从 API 拉取最新模型">🔄</button>
            </div>
          </div>
          <div class="form-row">
            <label>思考模式</label>
            <select id="set-ai-thinking">
              <option value="on">开启</option>
              <option value="off">关闭</option>
            </select>
          </div>
          <div class="form-row">
            <label>推理程度</label>
            <select id="set-ai-effort">
              <option value="low">low</option>
              <option value="high" selected>high</option>
              <option value="max">max</option>
            </select>
          </div>
          <div class="form-row">
            <label>显示 AI 解释</label>
            <select id="set-ai-explain">
              <option value="on">开启</option>
              <option value="off">关闭</option>
            </select>
          </div>
          <div class="form-row">
            <label>显示 AI 问答</label>
            <select id="set-ai-ask">
              <option value="on">开启</option>
              <option value="off">关闭</option>
            </select>
          </div>
          <div id="ai-settings-status"></div>
          <div class="settings-actions">
            <button id="btn-ai-test">测试 AI</button>
            <button id="btn-settings-save">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="pdfjs/pdf.min.js"></script>
  <script src="pdf-viewer.js"></script>
  <script src="app.js"></script>
</body>
</html>
